server:
  port: ${PORT:8082}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

catalog:
  url: ${CATALOG_URL:http://localhost:8081}

orders:
  simulation:
    enabled: ${ORDERS_SIMULATION_ENABLED:true}
    interval-ms: ${ORDERS_SIMULATION_INTERVAL_MS:6000}
    cancel-rate: ${ORDERS_SIMULATION_CANCEL_RATE:0.3}